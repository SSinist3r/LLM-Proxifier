services:
  llm-proxy:
    image: ghcr.io/mirrowel/llm-api-key-proxy:latest
    container_name: llm-api-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount entire project directory for configuration and data persistence
      # Note: This overlays the container's /app directory - ensure all required files exist on host
      - ./:/app
    environment:
      # Skip OAuth interactive initialization in container (non-interactive)
      - SKIP_OAUTH_INIT_CHECK=true
      # Ensure Python output is not buffered
      - PYTHONUNBUFFERED=1
